global:
  scrape_interval: 60s

scrape_configs:
  - job_name: api
    scrape_interval: 10s
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8080"]
        labels:
          component: "application"

  - job_name: worker
    scrape_interval: 5s
    metrics_path: /metrics
    static_configs:
      - targets: ["worker:9101"]
        labels:
          component: "application"

  - job_name: custom-exporter
    scrape_interval: 10s
    metrics_path: /metrics
    static_configs:
      - targets: ["exporter:9102"]
        labels:
          component: "application"
          
  - job_name: node-exporter
    scrape_interval: 30s
    static_configs:
      - targets: ["node-exporter:9100"]
        labels:
          component: "infrastructure"
          layer: "host"

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]
        labels:
          component: "infrastructure"
          layer: "containers"  

  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]
        labels:
          component: "infrastructure"
          layer: "database"

  - job_name: rabbitmq
    static_configs:
      - targets: ["rabbitmq:15692"]
        labels:
          component: "infrastructure"
          layer: "broker"

remote_write:
  - url: http://victoriametrics:8428/api/v1/write