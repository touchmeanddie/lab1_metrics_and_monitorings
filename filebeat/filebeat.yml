filebeat.inputs:
  - type: filestream
    id: api-logs
    paths:
      - /app/logs/api.log
    parsers:
      - ndjson:
          target: ""
          overwrite_keys: true
          add_error_key: true

  - type: filestream
    id: worker-logs
    paths:
      - /app/logs/worker.log
    parsers:
      - ndjson:
          target: ""
          overwrite_keys: true
          add_error_key: true

output.logstash:
  hosts: ["logstash:5044"]