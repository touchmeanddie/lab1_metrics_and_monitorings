filebeat.autodiscover:
  providers:
    - type: docker
      hints.enabled: true
      templates:
        - condition:
            contains:
              docker.container.name: "fast_api_project-api-1"
          config:
            - type: docker
              containers.ids: ["${docker.container.id}"]
              json.keys_under_root: true
              json.add_error_key: true
              json.overwrite_keys: true
        - condition:
            contains:
              docker.container.name: "fast_api_project-worker-1"
          config:
            - type: docker
              containers.ids: ["${docker.container.id}"]
              json.keys_under_root: true
              json.add_error_key: true
              json.overwrite_keys: true

output.logstash:
  hosts: ["logstash:5044"]